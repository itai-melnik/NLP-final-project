# Judge-bias experimental pipeline — single source of truth for paths, seeds,
# filters, model ids, and versions. Every stage reads this; every frozen
# artifact records the config hash it was built under (see §7 of the spec).

# ---------------------------------------------------------------------------
# Paths (relative to repo root)
# ---------------------------------------------------------------------------
paths:
  dataset_dir: swe-prbench/dataset
  prs_jsonl: swe-prbench/dataset/prs.jsonl
  eval_100: swe-prbench/dataset/evals/eval_100.json
  annotations_dir: swe-prbench/dataset/annotations
  artifacts_dir: artifacts

# ---------------------------------------------------------------------------
# Global reproducibility
# ---------------------------------------------------------------------------
seed: 20260723           # master seed; per-task seeds derived from (seed, task_id)

# ---------------------------------------------------------------------------
# Stage 0 — selection (spec §3)
# ---------------------------------------------------------------------------
selection:
  min_description_chars: 20        # after strip()
  max_diff_chars: 30000            # ~7.5k tokens
  min_file_sections: 2             # >= 2 files in the diff
  require_test_nontest_mix: true   # both a test file and a non-test file present
  short_description_chars: 150     # PRs below this get short_desc flag (verbosity sensitivity)
  # AI/bot-authorship screen (spec §3 filter 4): identified during design,
  # applied as an explicit drop-list so selection is fully deterministic.
  drop_list:
    - chia-blockchain__20321
    - openbao__2307
    - pipecat__3692

# ---------------------------------------------------------------------------
# Stage 1 — variant construction (spec §4)
# ---------------------------------------------------------------------------
variants:
  # The 9-variant matrix is fixed in code (src/prjudge/variants.py); listed
  # here for reference / run-selection filtering.
  ids:
    - baseline
    - verb_terse
    - verb_pad2x
    - verb_pad4x
    - repo_masked
    - origin_claude
    - origin_gpt
    - order_rev
    - placebo
  repo_mask_token: "project/repo"
  origin_claude_trailer: "Co-Authored-By: Claude <noreply@anthropic.com>"
  origin_gpt_trailer: "Co-Authored-By: Copilot <copilot@users.noreply.github.com>"
  placebo_pr_number: 99999
  placebo_date: "2020-01-01T00:00:00Z"
  # Verbosity target token ratios vs baseline description, with ±tolerance (§4.2).
  verbosity_targets:
    verb_terse: 0.5
    verb_pad2x: 2.0
    verb_pad4x: 4.0
  verbosity_tolerance: 0.20        # ±20% band on the target ratio

  # Terse-infeasibility waivers (spec §4.2/§8): these descriptions are dominated
  # by content the cc-v1 rules forbid compressing (fenced code, template
  # headings, inline JSON examples, URLs), so the 0.5x band is unreachable
  # without dropping facts. Their verb_terse ratio check is non-blocking, and
  # they are excluded from the terse arm of the dose-response analysis
  # (alongside short_desc PRs). Pre-registered before any judging.
  terse_waivers:
    - coreos-assembler__4359       # 17 words: QMP JSON command + issue URL
    - espnet__6248                 # 18 of 43 words are template headings
    - openbao__1906                # 27 of 56 words are a fenced terminal transcript
    - zod__5672                    # inline JSON examples dominate

  # Construction method for the LLM-assisted verbosity rewrites.
  # provider "claude-code": rewrites are authored interactively in Claude Code
  # via the rewrite-variants skill (frozen rule set cc-v1, no API spend); script
  # 01 emits a rewrites_pending.json work queue for cache misses and re-verifies
  # on re-run. LIMITATION (spec §4.5): the construction model is Claude-family —
  # the same family as the "claude" judge — so verbosity rewrites carry a Claude
  # stylistic fingerprint that may interact with self-preference for that judge.
  construction_model:
    provider: claude-code
    model: claude-opus-4-8         # Opus 4.8, high reasoning (recorded in provenance)
    method: rewrite-variants-skill # .claude/skills/rewrite-variants/SKILL.md

# ---------------------------------------------------------------------------
# Stage 2 — judging (spec §5)
# ---------------------------------------------------------------------------
judging:
  trials: 3                        # per cell, at provider-default temperature
  prompt_version: v1               # which frozen system prompt to use (see prompts.py)
  max_output_tokens: 2048
  max_retries: 6
  retry_base_delay: 2.0            # seconds; exponential backoff

  # The two judges — PINNED 2026-07-25 (spec §8). temperature: null = use the
  # provider default (required for the run-to-run consistency metric to be
  # meaningful). The claude judge is deliberately NOT the construction model
  # (claude-opus-4-8): same family (disclosed limitation, §4.5) but not the
  # same model. An open-source judge is deferred to future work (§9).
  #
  # reasoning_effort: high on both, pinned explicitly (spec §8) so effort is
  # matched across providers rather than left to whatever each provider
  # defaults to. Sent as output_config.effort (Anthropic) / reasoning_effort
  # (OpenAI) — see src/prjudge/judge.py.
  #
  # context_window: recorded, NEVER requested — the API takes no
  # context-window parameter, so this is provenance metadata only (no
  # request field, no beta header). Values are each provider's live default
  # confirmed 2026-07-25 via models.retrieve('claude-sonnet-5') and public
  # model docs for gpt-5.6-terra:
  #   - claude: 1_000_000 = max_input_tokens on the live model card; Sonnet 5
  #     serves 1M context by default, no context-1m beta header needed
  #     (unlike Sonnet 4.x).
  #   - gpt: 1_050_000 = gpt-5.6-terra's published context window. Not the
  #     same number as the 272k input-token threshold above which OpenAI's
  #     higher-usage pricing tier kicks in — that's a billing boundary, not
  #     the context window, and is not recorded here.
  #
  # Snapshot check (2026-07-25): client.models.retrieve('claude-sonnet-5')
  # and client.models.list() (both providers) show no dated snapshot id for
  # either model — only the undated aliases below exist. Aliases are kept as
  # pinned; the runner logs the server-resolved `model_version` per row
  # (spec §7/§8), which is the reproducibility record if either provider
  # moves the alias later.
  judges:
    - name: claude                 # Claude-family frontier judge
      provider: anthropic
      model: claude-sonnet-5
      temperature: null
      reasoning_effort: high
      context_window: 1000000
      env_key: ANTHROPIC_API_KEY
    - name: gpt                    # GPT-family frontier judge
      provider: openai
      model: gpt-5.6-terra
      temperature: null
      reasoning_effort: high
      context_window: 1050000
      env_key: OPENAI_API_KEY

  # Final full-matrix run spec (40 PRs x 9 variants x 2 judges x 3 trials = 2,160).
  final_run_name: results_v1

  # Batch mode (--batch on script 02): 50% off input+output tokens vs sync, same
  # models, <=24h completion window. Any future openai_compatible judge (no
  # real batch API) would always run sync.
  batch:
    providers: [anthropic, openai]   # providers with a real batch API
    completion_window: "24h"         # OpenAI batch parameter
    max_resubmits: 2                 # per-cell batch attempts before sync mop-up

# ---------------------------------------------------------------------------
# Versions stamped into artifacts (bump on any breaking change)
# ---------------------------------------------------------------------------
versions:
  selection: v1
  variants: v1
  prompt: v1
  results: v1
